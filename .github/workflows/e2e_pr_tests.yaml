        run: |
          set -a
          source apps/daytona-e2e/.env.e2e
          set +a

          npx nx serve proxy --configuration=development > /tmp/proxy.log 2>&1 &
          echo $! > /tmp/proxy.pid

          npx nx serve dashboard --configuration=development > /tmp/dashboard.log 2>&1 &
          echo $! > /tmp/dashboard.pid

      - name: Wait for default snapshot to be available
        if: needs.detect.outputs.affected == 'true'
        run: |
          # Snapshot name comes from DEFAULT_SNAPSHOT (API creates name=imageName=DEFAULT_SNAPSHOT).
          # Do NOT assume it matches the repo owner: forks keep the upstream image org.
          DEFAULT_SNAPSHOT=$(grep '^DEFAULT_SNAPSHOT=' apps/daytona-e2e/.env.e2e | cut -d= -f2)
          SNAPSHOT_ENC=$(jq -rn --arg s "$DEFAULT_SNAPSHOT" '$s|@uri')
          echo "Waiting for default snapshot ($DEFAULT_SNAPSHOT) to become active..."
          echo "Runner must boot, API creates snapshot (pending), cron job transitions it to active"
          for i in $(seq 1 150); do
            BODY=$(curl -s \
              -H "Authorization: Bearer e2e_admin_api_key" \
