# E2E Sandbox Lifecycle Tests — PR (Built from Source)
#
# Runs automatically when nx affected detects changes to E2E-relevant projects
# (apps, SDKs, API clients). Builds from source, starts infrastructure + services,
# and runs daytona-e2e suite plus SDK E2E tests.
#
# Memory sharding (OOM fix): the previous single-job layout ran infra +
# api/runner/proxy/dashboard serves + ALL SDK E2E suites + TS runtime tooling
# (bun/deno/playwright/azure) on ONE ubuntu-latest runner. This file splits the
# same steps into parallel jobs, each on its own runner:
#
#   detect          lightweight nx-affected gate (only job that inspects the diff)
#   e2e-core        full stack + `yarn nx e2e daytona-e2e` (same command as before)
#   sdk-e2e matrix  full stack + `yarn nx run sdk-<lang>:test:e2e`, one SDK per
#                   runner (union == old `yarn test:e2e` == nx run-many --all)
#   sdk-ts-runtime  full stack + bun/deno/azure/playwright + runtime tests
#
# Test semantics are unchanged: every run:/uses: line below is copied verbatim
# from the single-job layout (same build flags, env files, migrations, wait
# loops, test commands, cleanup). Only `if:` conditions were re-pointed from
# `steps.affected` to `needs.detect.outputs.*`, and heavy one-SDK-only prereqs
# (python pytest deps, java publishToMavenLocal) now run only in their shard.

name: '[E2E] PR Sandbox Tests'

on:
  pull_request:
    branches:
      - main
      - develop
      # Integration branch: PRs targeting it run the same E2E gates as main.
      - nx-cloud-setup

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  # Memory caps only — no test-logic change. Keeps Node heap and Gradle
  # daemon from compounding with the 4 service processes + docker infra.
  NODE_OPTIONS: --max-old-space-size=3072
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx2g

jobs:
  # ---------------------------------------------------------------------------
  # Gate: cheap affected detection, no toolchain, no infra.
  # ---------------------------------------------------------------------------
  detect:
    if: github.repository == 'daytonaio/daytona' || github.repository == 'cognifyi/cogbox'
    name: Detect E2E-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
      sdk_ts_affected: ${{ steps.affected.outputs.sdk_ts_affected }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-${{ runner.arch }}-

      - run: yarn install --immutable

      - name: Check if E2E-relevant projects are affected
        id: affected
        run: |
          if ! AFFECTED=$(npx nx show projects --affected --base=origin/${{ github.event.pull_request.base.ref }} --head=HEAD); then
            echo "Failed to determine affected projects"
            exit 1
          fi
          echo "Affected projects: $AFFECTED"
          if echo "$AFFECTED" | grep -qE 'daytona-e2e|^api$|^runner$|^proxy$|^daemon$|^dashboard$|sdk-typescript|sdk-python|sdk-go|sdk-ruby|sdk-java|api-client|toolbox-api-client'; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
            echo "No E2E-relevant projects affected — skipping"
          fi
          if echo "$AFFECTED" | grep -qE '(^|,| )sdk-typescript($|,| )|(^|,| )api-client($|,| )|(^|,| )toolbox-api-client($|,| )'; then
            echo "sdk_ts_affected=true" >> $GITHUB_OUTPUT
          else
            echo "sdk_ts_affected=false" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Shard 1: core Go E2E suite (own runner, own stack).
  # ---------------------------------------------------------------------------
  e2e-core:
    if: github.repository == 'daytonaio/daytona' || github.repository == 'cognifyi/cogbox'
    needs: detect
    name: E2E core (daytona-e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        if: needs.detect.outputs.affected == 'true'
        with:
          # Core Go suite needs Go/Node/Python only; skip Ruby/Java to
          # reduce setup memory/time. Test commands are unchanged.
          install-ruby: 'false'
          install-java: 'false'

      - name: Configure Docker daemon for insecure local registry
        if: needs.detect.outputs.affected == 'true'
        run: |
          echo '{"insecure-registries": ["localhost:5000"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sudo systemctl is-active docker

      - name: Start infrastructure (postgres, redis, dex, registry)
        if: needs.detect.outputs.affected == 'true'
        run: |
          docker compose -f apps/daytona-e2e/docker-compose.e2e.yaml up -d --wait
          docker compose -f apps/daytona-e2e/docker-compose.e2e.yaml ps

      - name: Build services needed for E2E
        if: needs.detect.outputs.affected == 'true'
        run: |
          source "$(poetry env info --path)/bin/activate"
          VERSION=v0.0.0-dev yarn nx run-many --target=build --projects=api,runner,proxy,dashboard

      - name: Copy E2E env to API
        if: needs.detect.outputs.affected == 'true'
        run: cp apps/daytona-e2e/.env.e2e apps/api/.env

      - name: Run DB migrations
        if: needs.detect.outputs.affected == 'true'
        run: yarn migration:run:init && yarn migration:run:pre-deploy

      - name: Install gow (Go file watcher for serve targets)
        if: needs.detect.outputs.affected == 'true'
        run: go install github.com/mitranim/gow@v0.0.0-20260225145757-ff0f6779ab4c

      - name: Start API and runner
        if: needs.detect.outputs.affected == 'true'
        run: |
          set -a
          source apps/daytona-e2e/.env.e2e
          set +a

          npx nx serve api --configuration=development > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

          npx nx serve runner --configuration=development > /tmp/runner.log 2>&1 &
          echo $! > /tmp/runner.pid

      - name: Wait for API to be ready
        if: needs.detect.outputs.affected == 'true'
        run: |
          echo "Waiting for API at http://localhost:3001/api/health ..."
          echo "Note: nx serve compiles Go services via gow before starting (~90s)"
          for i in $(seq 1 150); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "API is ready (attempt $i, elapsed ~$((i*2))s)"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start within 300s"
          echo "=== API logs (last 100 lines) ==="
          tail -100 /tmp/api.log 2>/dev/null || echo "No API logs found"
          echo "=== Runner logs (last 50 lines) ==="
          tail -50 /tmp/runner.log 2>/dev/null || echo "No runner logs found"
          exit 1

      - name: Start proxy and dashboard
        if: needs.detect.outputs.affected == 'true'
        run: |
          set -a
          source apps/daytona-e2e/.env.e2e
          set +a

          npx nx serve proxy --configuration=development > /tmp/proxy.log 2>&1 &
          echo $! > /tmp/proxy.pid

          npx nx serve dashboard --configuration=development > /tmp/dashboard.log 2>&1 &
          echo $! > /tmp/dashboard.pid

      - name: Wait for default snapshot to be available
        if: needs.detect.outputs.affected == 'true'
        run: |
          # Snapshot name comes from DEFAULT_SNAPSHOT (API creates name=imageName=DEFAULT_SNAPSHOT).
          # Do NOT assume it matches the repo owner: forks keep the upstream image org.
          DEFAULT_SNAPSHOT=$(grep '^DEFAULT_SNAPSHOT=' apps/daytona-e2e/.env.e2e | cut -d= -f2)
          SNAPSHOT_ENC=$(jq -rn --arg s "$DEFAULT_SNAPSHOT" '$s|@uri')
          echo "Waiting for default snapshot ($DEFAULT_SNAPSHOT) to become active..."
          echo "Runner must boot, API creates snapshot (pending), cron job transitions it to active"
          for i in $(seq 1 150); do
            BODY=$(curl -s \
              -H "Authorization: Bearer e2e_admin_api_key" \
              "http://localhost:3001/api/snapshots/${SNAPSHOT_ENC}" 2>/dev/null || echo "")
            STATE=$(echo "$BODY" | jq -r '.state // empty' 2>/dev/null || echo "")
            if [ "$STATE" = "active" ]; then
              echo "Default snapshot is active (attempt $i, elapsed ~$((i*2))s)"
              exit 0
            fi
            if [ "$((i % 10))" = "0" ]; then
              echo "Attempt $i: snapshot state='${STATE:-not found}' (elapsed ~$((i*2))s)"
            fi
            sleep 2
          done
          echo "Default snapshot not active after 300s"
          echo "Last snapshot response:"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
          echo ""
          echo "=== Runner DB entry (state inspection) ==="
          docker compose -f apps/daytona-e2e/docker-compose.e2e.yaml exec -T db \
            psql -U user -d application_ctx -x -c \
            'SELECT id, domain, "apiUrl", "proxyUrl", region, name, state, "appVersion", "apiVersion", "lastChecked", unschedulable, draining, "availabilityScore", "currentSnapshotCount", "serviceHealth", "createdAt", "updatedAt" FROM runner;' \
            || echo "Failed to query runner table"
          echo ""
          echo "=== Runner logs (full) ==="
          cat /tmp/runner.log 2>/dev/null || echo "No runner logs found"
          echo ""
          echo "=== API logs (last 50 lines) ==="
          tail -50 /tmp/api.log 2>/dev/null || echo "No API logs found"
          exit 1

      - name: Run daytona-e2e tests
        if: needs.detect.outputs.affected == 'true'
        env:
          DAYTONA_API_URL: http://localhost:3001/api
          DAYTONA_API_KEY: e2e_admin_api_key
        run: yarn nx e2e daytona-e2e

      - name: Cleanup stale E2E sandboxes
        if: always() && needs.detect.outputs.affected == 'true'
        env:
          DAYTONA_API_URL: http://localhost:3001/api
          DAYTONA_API_KEY: e2e_admin_api_key
        run: yarn nx e2e:cleanup daytona-e2e

      - name: Dump service logs
        if: always() && needs.detect.outputs.affected == 'true'
        run: |
          for svc in api runner proxy dashboard; do
            echo "=== ${svc} logs (last 200 lines) ==="
            tail -200 /tmp/${svc}.log 2>/dev/null || echo "No ${svc} logs found"
          done

      - name: Stop services
        if: always() && needs.detect.outputs.affected == 'true'
        run: |
          for svc in api runner proxy dashboard; do
            if [ -f /tmp/${svc}.pid ]; then
              kill $(cat /tmp/${svc}.pid) 2>/dev/null || true
            fi
          done

      - name: Tear down infrastructure
        if: always() && needs.detect.outputs.affected == 'true'
        run: docker compose -f apps/daytona-e2e/docker-compose.e2e.yaml down -v

  # ---------------------------------------------------------------------------
  # Shard 2: SDK E2E matrix — one SDK per runner.
  # Union of shards == old `yarn test:e2e` (nx run-many --target=test:e2e --all).
  # ---------------------------------------------------------------------------
  sdk-e2e:
    if: github.repository == 'daytonaio/daytona' || github.repository == 'cognifyi/cogbox'
    needs: detect
    name: SDK E2E (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # nx project is always `sdk-<sdk>`; test target `test:e2e` is invoked
        # per project, identical to what `yarn test:e2e` fans out to.
        sdk: [python, go, typescript, ruby, java]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        if: needs.detect.outputs.affected == 'true'
        with:
          # Only the ruby/java shards need their runtimes; the rest skip them
          # to reduce setup memory/time. Test commands are unchanged.
          install-ruby: ${{ matrix.sdk == 'ruby' && 'true' || 'false' }}
          install-java: ${{ matrix.sdk == 'java' && 'true' || 'false' }}

      - name: Configure Docker daemon for insecure local registry
        if: needs.detect.outputs.affected == 'true'
        run: |
          echo '{"insecure-registries": ["localhost:5000"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sudo systemctl is-active docker

      - name: Start infrastructure (postgres, redis, dex, registry)
        if: needs.detect.outputs.affected == 'true'
        run: |
          docker compose -f apps/daytona-e2e/docker-compose.e2e.yaml up -d --wait
          docker compose -f apps/daytona-e2e/docker-compose.e2e.yaml ps

      - name: Build services needed for E2E
        if: needs.detect.outputs.affected == 'true'
        run: |
          source "$(poetry env info --path)/bin/activate"
          VERSION=v0.0.0-dev yarn nx run-many --target=build --projects=api,runner,proxy,dashboard

      - name: Copy E2E env to API
        if: needs.detect.outputs.affected == 'true'
        run: cp apps/daytona-e2e/.env.e2e apps/api/.env

      - name: Run DB migrations
        if: needs.detect.outputs.affected == 'true'
        run: yarn migration:run:init && yarn migration:run:pre-deploy

      - name: Install gow (Go file watcher for serve targets)
        if: needs.detect.outputs.affected == 'true'
        run: go install github.com/mitranim/gow@v0.0.0-20260225145757-ff0f6779ab4c

      - name: Start API and runner
        if: needs.detect.outputs.affected == 'true'
        run: |
          set -a
          source apps/daytona-e2e/.env.e2e
          set +a

          npx nx serve api --configuration=development > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

          npx nx serve runner --configuration=development > /tmp/runner.log 2>&1 &
          echo $! > /tmp/runner.pid

      - name: Wait for API to be ready
        if: needs.detect.outputs.affected == 'true'
        run: |
          echo "Waiting for API at http://localhost:3001/api/health ..."
          echo "Note: nx serve compiles Go services via gow before starting (~90s)"
          for i in $(seq 1 150); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "API is ready (attempt $i, elapsed ~$((i*2))s)"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start within 300s"
          echo "=== API logs (last 100 lines) ==="
          tail -100 /tmp/api.log 2>/dev/null || echo "No API logs found"
          echo "=== Runner logs (last 50 lines) ==="
          tail -50 /tmp/runner.log 2>/dev/null || echo "No runner logs found"
          exit 1

      - name: Start proxy and dashboard
